    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>

    <style>
      .app-splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        padding: env(safe-area-inset-top, 0px) 24px env(safe-area-inset-bottom, 0px);
        background:
          radial-gradient(circle at 78% 12%, rgba(126, 168, 112, 0.3), transparent 38%),
          radial-gradient(circle at 14% 88%, rgba(80, 132, 83, 0.24), transparent 34%),
          linear-gradient(160deg, #0b1b15 0%, #10251b 52%, #0b1a14 100%);
        color: #f4f0e5;
        font-family: "Inter Tight", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
        animation: app-splash-in 0.4s ease-out both;
      }
      .app-splash-icon {
        width: 96px;
        height: 96px;
        filter: drop-shadow(0 14px 30px rgba(0, 0, 0, 0.4)) drop-shadow(0 0 28px rgba(126, 168, 112, 0.22));
        animation: app-splash-float 2.8s ease-in-out infinite;
      }
      .app-splash-name {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      .app-splash-tagline {
        margin: -14px 0 0;
        color: #c4a07a;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        font-style: italic;
      }
      .app-splash-bar {
        position: relative;
        width: 148px;
        height: 3px;
        margin-top: 6px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(244, 240, 229, 0.12);
      }
      .app-splash-bar::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 40%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, #c4a07a 30%, #e2c39e 50%, #c4a07a 70%, transparent);
        animation: app-splash-bar 1.4s ease-in-out infinite;
        animation-delay: var(--app-splash-offset, 0ms);
      }
      @keyframes app-splash-in {
        from { opacity: 0; }
      }
      @keyframes app-splash-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }
      @keyframes app-splash-bar {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-splash, .app-splash-icon { animation: none; }
        .app-splash-bar::after { animation-duration: 3s; }
      }
    </style>

  <body>
    <div id="root"></div>
    <script>
      (function () {
        var path = window.location.pathname;
        var inside = path === "/app" || path.indexOf("/app/") === 0 || path === "/admin" || path.indexOf("/admin/") === 0;
        if (!inside) return;
        document.getElementById("root").innerHTML =
          '<div class="app-splash" role="status" aria-label="Loading Safety Prep List">' +
          '<img class="app-splash-icon" src="/icons/icon-192.png?v=3" width="96" height="96" alt="" />' +
          '<p class="app-splash-name">Safety Prep List</p>' +
          '<p class="app-splash-tagline">Hope for the best, Prepare for the rest.</p>' +
          '<div class="app-splash-bar" aria-hidden="true"></div>' +
          "</div>";
      })();
    </script>
